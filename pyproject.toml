[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anders-health-core"
version = "0.1.0"
description = "Local-first physical-health data and analytics foundation"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Anders Health Core contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = ["jsonschema>=4.18,<5"]

[project.optional-dependencies]
test = []

[project.scripts]
anders-health-core = "anders_health_core.cli:main"

[tool.setuptools]
packages = ["anders_health_core", "anders_health_core.migrations", "anders_health_core.schemas"]

[tool.setuptools.package-dir]
"anders_health_core.schemas" = "schemas"

[tool.setuptools.package-data]
"anders_health_core.migrations" = ["*.sql"]
"anders_health_core.schemas" = ["*.json"]
