[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anders-health-core"
version = "0.1.0"
description = "Local-first physical-health data and analytics foundation"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Anders Health Core contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = []

[project.scripts]
anders-health-core = "anders_health_core.cli:main"

[tool.setuptools.package-data]
anders_health_core = ["migrations/*.sql"]

[tool.setuptools.packages.find]
include = ["anders_health_core*"]
exclude = ["tests*", "schemas*", "examples*", "docs*", "scripts*"]
namespaces = false
